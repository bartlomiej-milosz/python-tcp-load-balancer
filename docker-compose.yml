services:
  http-server-1:
    build: .
    command: ["python", "-m", "app.run_http_server", "8080"]
    environment:
      HOST: 0.0.0.0
      BACKEND_ID: backend-1

  http-server-2:
    build: .
    command: ["python", "-m", "app.run_http_server", "8080"]
    environment:
      HOST: 0.0.0.0
      BACKEND_ID: backend-2

  http-server-3:
    build: .
    command: ["python", "-m", "app.run_http_server", "8080"]
    environment:
      HOST: 0.0.0.0
      BACKEND_ID: backend-3

  load-balancer:
    build: .
    command: ["python", "-m", "app.run_load_balancer"]
    environment:
      HOST: 0.0.0.0
      BACKEND_SERVERS: http-server-1:8080,http-server-2:8080,http-server-3:8080
    depends_on:
      - http-server-1
      - http-server-2
      - http-server-3

  proxy:
    build: .
    command: ["python", "-m", "app.run_proxy_server"]
    environment:
      HOST: 0.0.0.0
      TARGET_HOST: load-balancer
      TARGET_PORT: "8001"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - load-balancer
