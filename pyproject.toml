[project]
name = "python-tcp-load-balancer"
version = "0.1.0"
description = "Educational TCP load balancer in Python with round-robin routing, a TCP proxy, and a minimal HTTP server."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: real loopback socket tests"]
